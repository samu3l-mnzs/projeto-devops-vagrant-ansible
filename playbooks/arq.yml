# ==============================================================================
# SERVIDOR DE ARQUIVOS (arq)
# ==============================================================================

- import_playbook: comum.yml

- name: Configurações do Servidor de Arquivos
  hosts: arq
  become: true
  tasks:
    - name: Instalar serviços DHCP, DNS, NFS Server e LVM
      apt:
        name:
          - isc-dhcp-server
          - bind9
          - nfs-kernel-server
          - lvm2
        state: present

    - name: Copiar o arquivo de configuracao dhcp
      copy:
        src: arquivos/dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
        mode: '0644'
      notify: restart dhcp

    - name: Ajustar a configuracao default do dhcp para ouvir na eth1
      lineinfile:
        dest: /etc/default/isc-dhcp-server
        regexp: "^INTERFACESv4"
        line: 'INTERFACESv4="eth1"'
      notify: restart dhcp

    # -- Configuração do LVM --

    - name: Criar Volume Group (VG) chamado 'dados' com os 3 discos
      lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd

    - name: Criar Logical Volume (LV) chamado 'ifpb' com 15GB
      lvol:
        vg: dados
        lv: ifpb
        size: 15g

    - name: Formatar o LV ifpb com ext4
      filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Montar a partição automaticamente no diretório /dados
      mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        state: mounted

    # -- Configuração do NFS --
    # O usuário nfs-ifpb e o getent agora vêm do comum.yml.

    - name: Garantir /dados/nfs dentro do LV já montado
      # O comum.yml roda antes do LVM ser montado em /dados; sem esta tarefa
      # o diretório criado lá ficaria escondido sob o ponto de montagem.
      file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0755'

    - name: Configurar partilha no /etc/exports
      lineinfile:
        path: /etc/exports
        line: "/dados/nfs 192.168.56.0/24(rw,sync,all_squash,anonuid={{ ansible_facts.getent_passwd['nfs-ifpb'][1] }},anongid={{ ansible_facts.getent_passwd['nfs-ifpb'][2] }})"
      notify: restart nfs

    # -- Mesmo caminho do compartilhamento (/var/nfs) também no arq --

    - name: Criar o diretório /var/nfs no arq
      file:
        path: /var/nfs
        state: directory
        mode: '0755'

    - name: Montar /dados/nfs em /var/nfs (bind) para o arq ter o mesmo caminho das demais VMs
      mount:
        path: /var/nfs
        src: /dados/nfs
        fstype: none
        opts: bind
        state: mounted

    # -- Configuração do DNS (bind9): opções, zona direta e zona reversa --

    - name: Copiar configuração do bind9 (opções, zonas direta e reversa)
      copy:
        src: "arquivos/{{ item }}"
        dest: "/etc/bind/{{ item }}"
        owner: root
        group: bind
        mode: '0644'
      loop:
        - named.conf.options
        - named.conf.local
        - db.samuel.vinicius.devops
        - db.192.168.56
      notify: restart bind9

    - name: Garantir DHCP, DNS e NFS ativos e habilitados no boot
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - isc-dhcp-server
        - bind9
        - nfs-kernel-server

  handlers:
    - name: restart bind9
      service:
        name: bind9
        state: restarted

    - name: restart nfs
      service:
        name: nfs-kernel-server
        state: restarted

    - name: restart dhcp
      service:
        name: isc-dhcp-server
        state: restarted
